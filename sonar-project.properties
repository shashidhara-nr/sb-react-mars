# SonarQube Project Configuration
sonar.projectKey=za.co.sb.bol:React-bol
sonar.projectName=React-bol
sonar.projectVersion=1.0
 
# Source and test directories
sonar.sources=src,app,components,lib,types,utils
sonar.tests=__tests__
 
# File inclusions - TypeScript/JavaScript files in source directories
sonar.inclusions=src/**/*.ts,src/**/*.tsx,src/**/*.js,src/**/*.jsx,app/**/*.ts,app/**/*.tsx,app/**/*.js,app/**/*.jsx,components/**/*.ts,components/**/*.tsx,components/**/*.js,components/**/*.jsx,lib/**/*.ts,lib/**/*.tsx,lib/**/*.js,lib/**/*.jsx,types/**/*.ts,types/**/*.tsx,utils/**/*.ts,utils/**/*.tsx,utils/**/*.js,utils/**/*.jsx
 
# File exclusions - Build artifacts, dependencies, and test utilities
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/build/**,**/dist/**,**/*.config.js,**/*.config.ts,**/__mocks__/**,**/test-utils/**
 
# Test file patterns
sonar.test.inclusions=__tests__/**/*.test.ts,__tests__/**/*.test.tsx,__tests__/**/*.spec.ts,__tests__/**/*.spec.tsx
 
# Code coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info
 
# Encoding and TypeScript configuration
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json